version:
  plugin: 0.1.0
  contract: ">=1.0 <2.0"
form: command
entry:
  executable: bin/starter-command
capabilities:
  - id: starter-command.greet
    description: 按输入 name 返回问候语；演示输入校验、结构化错误与退出码映射
    input_schema_ref: schemas/greet-input.json
    output_schema_ref: schemas/greet-output.json
    idempotent: true
    long_running: false
    supports_cancel: false
